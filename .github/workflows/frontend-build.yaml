name: "Frontend Build"

on:
  push:
    paths:
      - "assets/**"
  pull_request:
    paths:
      - "assets/**"
  workflow_dispatch:

concurrency:
  group: frontend-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  frontend-build:
    permissions:
      contents: write
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-studio-frontend-build.yaml@a7738feba5d7b0846a48c0fadfd5c993b484fa3f
    with:
      working-directory: ./assets
      node-version: "26"
      build-output-path: ./public/build/
